{% load i18n %}{% for p in products %}
    <div class="pl-item" data-shop="{{ p.shop|lower }}">
        {% include 'partials/product_card.html' with product=p show_discount=True %}
    </div>
{% empty %}
    <div class="cx-empty"><i class="fas fa-box-open fa-2x mb-3"></i><p class="mb-0">{% trans "No products found." %}</p></div>
{% endfor %}
